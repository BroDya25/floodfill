# ================= Производственный профиль (бесплатный хостинг) =================
# Активируется переменной окружения SPRING_PROFILES_ACTIVE=prod на хостинге.
#
# JDBC_DATABASE_URL - полная строка подключения с кредами, задаётся в дашборде хостинга.
# Пример для Neon (direct endpoint, без "-pooler"):
#   jdbc:postgresql://ep-xxxxx-pooler.eu-central-1.aws.neon.tech/neondb?user=USER&password=PASS&sslmode=require
spring.datasource.url=${JDBC_DATABASE_URL}

# Пул минимален: не превышать лимиты бесплатных БД и не держать "висящих"
# соединений, чтобы Neon уходил в scale-to-zero (экономия CU-часов).
spring.datasource.hikari.maximumPoolSize=2
spring.datasource.hikari.minimumIdle=0
spring.datasource.hikari.idleTimeout=60000

# Render передаёт порт через переменную окружения PORT.
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
