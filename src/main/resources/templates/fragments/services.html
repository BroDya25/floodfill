<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="ratingFragment" id="rating-section" class="service-section">
    <h2>⭐ Rating</h2>
    <p class="avg-rating">
        Average: <strong th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">0.0</strong> / 5
    </p>
    <div class="star-rating">
        <p>Rate this game:</p>
        <span th:each="i : ${#numbers.sequence(1, 5)}">
            <a th:href="@{/floodfill/rating(rating=${i})}"
               th:class="${i <= userRating} ? 'star filled js-rating' : 'star js-rating'">★</a>
        </span>
    </div>
</section>

<section th:fragment="commentFragment" id="comment-section" class="service-section">
    <h2>💬 Comments</h2>
    <div class="comments-list">
        <div class="comment-item" th:each="c : ${comments}">
            <div class="comment-header">
                <strong th:text="${c.player}">Player</strong>
                <span class="comment-date" th:text="${#dates.format(c.commentedOn, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <p th:text="${c.comment}">Comment text</p>
        </div>
        <p th:if="${#lists.isEmpty(comments)}" class="empty-msg">No comments yet.</p>
    </div>

    <form class="comment-form" id="ajax-comment-form" action="/floodfill/comment" method="post">
        <h3>Leave a comment</h3>
        <textarea name="comment" placeholder="Write your comment..." maxlength="255" rows="3" required></textarea>
        <button type="submit" class="btn btn-submit">Post Comment</button>
    </form>
</section>

</body>
</html>
