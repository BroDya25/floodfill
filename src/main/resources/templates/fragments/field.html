<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<body>

<div th:fragment="gameFragment" id="game-area" class="game-area">
    <div class="status-bar">
        <ul class="menu-bar">
            <li>
                <div class="menu">Field Type &darr;</div>
                <ul>
                    <li><a th:href="@{/floodfill/type(type=${12})}">12x12</a></li>
                    <li><a th:href="@{/floodfill/type(type=${14})}">14x14</a></li>
                    <li><a th:href="@{/floodfill/type(type=${16})}">16x16</a></li>
                    <li><a th:href="@{/floodfill/type(type=${18})}">18x18</a></li>
                    <li><a th:href="@{/floodfill/type(type=${20})}">20x20</a></li>
                </ul>
            </li>
        </ul>
        <div class="log-bar">
            <div class="moves-counter">
                Moves: <strong th:text="${currentMoves}">0</strong> / <span th:text="${maxMoves}">0</span>
            </div>

            <div th:if="${gameState == 'SOLVED'}" class="game-message win">
                🎉 You won!
            </div>
            <div th:if="${gameState == 'FAILED'}" class="game-message lose">
                😞 Game over!
            </div>
        </div>
    </div>

    <div class="field-container">
        <div class="game-field" th:style="'grid-template-columns: repeat(' + ${size} + ', 1fr)'">
            <div th:each="row : ${field.grid}">
                <div th:each="cell : ${row}" class="cell" th:classappend="${#strings.toLowerCase(cell.color.name())}"></div>
            </div>
        </div>
    </div>

    <div th:if="${gameState == 'PLAYING'}" class="color-picker">
        <a th:each="c : ${colors}"
           th:href="@{/floodfill(color=${c.name()})}"
           class="color-btn"
           th:classappend="${#strings.toLowerCase(c.name())}"
           th:title="${c.name()}"><svg fill="#00000" width="42px" height="42px" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" id="memory-radiobox-marked"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path d="M8 2H14V3H16V4H17V5H18V6H19V8H20V14H19V16H18V17H17V18H16V19H14V20H8V19H6V18H5V17H4V16H3V14H2V8H3V6H4V5H5V4H6V3H8V2M9 4V5H7V6H6V7H5V9H4V13H5V15H6V16H7V17H9V18H13V17H15V16H16V15H17V13H18V9H17V7H16V6H15V5H13V4H9M13 7V8H14V9H15V13H14V14H13V15H9V14H8V13H7V9H8V8H9V7H13Z"></path></g></svg></a>
    </div>

    <div class="controls">
        <a th:href="@{/floodfill/undo}"
           th:classappend="${!canUndo} ? ' btn-disabled'"
           class="btn btn-nav btn-undo"
           title="Undo">&#8592; Undo</a>
        <a th:href="@{/floodfill/redo}"
           th:classappend="${!canRedo} ? ' btn-disabled'"
           class="btn btn-nav btn-redo"
           title="Redo">Redo &#8594;</a>
        <a th:href="@{/floodfill/restartGame}" class="btn btn-nav">↩ Restart</a>
        <a th:href="@{/floodfill/newGame}"     class="btn btn-nav">⭮ New Game</a>
    </div>
</div>

</body>
</html>
